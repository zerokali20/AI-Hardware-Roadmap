name: Lab 03 - Register File Verification

on:
  push:
    branches:
      - main
    paths:
      - "labs/03-register-file-verification/**"
      - ".github/workflows/lab03-register-file-verification.yml"

  pull_request:
    branches:
      - main
    paths:
      - "labs/03-register-file-verification/**"
      - ".github/workflows/lab03-register-file-verification.yml"

jobs:
  verify-register-file:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: labs/03-register-file-verification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run register-file verification
        run: make
