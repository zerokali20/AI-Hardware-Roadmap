
name: Lab 05 - Formal Verification

on:
  push:
    paths:
      - "labs/05-formal-verification/**"
      - ".github/workflows/lab05-formal.yml"
  pull_request:
    paths:
      - "labs/05-formal-verification/**"
      - ".github/workflows/lab05-formal.yml"
  workflow_dispatch:

jobs:
  formal-verification:
    name: Yosys SAT Formal Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Check Yosys version
        run: yosys -V

      - name: Run formal verification
        working-directory: labs/05-formal-verification
        run: bash scripts/run_formal.sh
