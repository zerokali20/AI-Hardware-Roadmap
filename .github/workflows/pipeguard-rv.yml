name: PipeGuard-RV CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/pipeguard-rv/**'
      - '.github/workflows/pipeguard-rv.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/pipeguard-rv/**'
      - '.github/workflows/pipeguard-rv.yml'

jobs:
  pipeguard-rv-verify:
    name: Snapshot Regression, B0 Equivalence, Lint & Synthesis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys z3 make

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/pipeguard-rv/requirements.txt

      - name: Verify Snapshot Provenance (SHA-256)
        run: |
          cd projects/pipeguard-rv/rtl/core
          sha256sum -c SHA256SUMS

      - name: Run Snapshot Baseline Regression (30 suites)
        run: |
          cd projects/pipeguard-rv
          bash scripts/run_baseline_regression.sh

      - name: Run B0 Lock-Step Equivalence
        run: |
          cd projects/pipeguard-rv
          make test CONFIG=b0

      - name: Run M0, M1, M2 Unit, Lock-Step & Fault-Injection Tests
        run: |
          cd projects/pipeguard-rv
          make test CONFIG=m0
          make test CONFIG=m1
          make test CONFIG=m2

      - name: Run Verilator Lint
        run: |
          cd projects/pipeguard-rv
          make lint

      - name: Run Formal Verification (BMC depth 25)
        run: |
          cd projects/pipeguard-rv
          make formal

      - name: Run B0, M0, M1, M2 Yosys Synthesis
        run: |
          cd projects/pipeguard-rv
          make synth CONFIG=b0
          make synth CONFIG=m0
          make synth CONFIG=m1
          make synth CONFIG=m2
