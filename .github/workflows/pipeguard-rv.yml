name: PipeGuard-RV CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/pipeguard-rv/**'
      - '.github/workflows/pipeguard-rv.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/pipeguard-rv/**'
      - '.github/workflows/pipeguard-rv.yml'

jobs:
  baseline-regression:
    name: Baseline RTL Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys make

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/pipeguard-rv/requirements.txt

      - name: Verify Tool Versions
        run: |
          iverilog -V | head -n 1
          yosys --version
          python --version
          make --version | head -n 1

      - name: Run Baseline Regression (Lab 06)
        run: |
          cd labs/06-riscv-pipeline
          python -m venv .venv
          source .venv/bin/activate
          pip install cocotb pytest
          make clean
          make TEST=cpu
          make clean
          make TEST=cpuhaz
          make clean
          make TEST=cpuisa
          make clean
          make TEST=cpumembranch
          make clean
          make TEST=pipectrl

      - name: Run PipeGuard-RV Project Structure Check
        run: |
          test -d projects/pipeguard-rv/rtl/core
          test -f projects/pipeguard-rv/rtl/core/riscv_pipeline_cpu.sv
          test -f projects/pipeguard-rv/Makefile
